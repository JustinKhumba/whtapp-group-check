<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web Integration</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.io client script is automatically served by the socket.io backend -->
  <script src="/socket.io/socket.io.js"></script>
  
  <style>
    /* Custom scrollbar for chat list */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-slate-100">
    
    <div class="flex items-center space-x-3 mb-6">
        <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center shadow-sm text-white font-bold text-xl">
            W
        </div>
        <h1 class="text-2xl font-bold text-slate-800">WhatsApp Test</h1>
    </div>
    
    <!-- Status Banner -->
    <div id="status-message" class="mb-6 p-4 bg-blue-50 text-blue-700 rounded-xl border border-blue-100 font-medium text-sm transition-all duration-300">
        Connecting to Server...
    </div>

    <!-- QR Code Section -->
    <div id="qr-container" class="hidden flex flex-col items-center animate-fade-in">
        <p class="text-sm text-slate-500 mb-4 text-center">Open WhatsApp on your phone -> Settings -> Linked Devices -> Link a Device</p>
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
            <img id="qr-image" src="" alt="Scan this QR Code" class="w-48 h-48 object-contain">
        </div>
    </div>

    <!-- Chats Section -->
    <div id="chats-container" class="hidden animate-fade-in">
        <div class="flex justify-between items-end mb-3 px-1">
            <h2 class="text-lg font-semibold text-slate-700">Recent Chats</h2>
            <span class="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-md"><span id="chat-count">0</span> Total</span>
        </div>
        <ul id="chats-list" class="divide-y divide-slate-100 h-80 overflow-y-auto border border-slate-100 rounded-xl bg-slate-50 shadow-inner p-1">
            <!-- Chats injected here via JS -->
        </ul>
    </div>
  </div>

  <script>
    const socket = io();
    const statusMessage = document.getElementById('status-message');
    const qrContainer = document.getElementById('qr-container');
    const qrImage = document.getElementById('qr-image');
    const chatsContainer = document.getElementById('chats-container');
    const chatsList = document.getElementById('chats-list');
    const chatCount = document.getElementById('chat-count');

    socket.on('connect', () => {
        statusMessage.textContent = 'Connected to Server. Waiting for WhatsApp...';
        statusMessage.className = 'mb-6 p-4 bg-yellow-50 text-yellow-800 rounded-xl border border-yellow-200 font-medium text-sm transition-all duration-300';
    });

    socket.on('disconnect', () => {
        statusMessage.textContent = 'Disconnected from Server.';
        statusMessage.className = 'mb-6 p-4 bg-red-50 text-red-700 rounded-xl border border-red-100 font-medium text-sm transition-all duration-300';
    });

    socket.on('message', (msg) => {
        statusMessage.textContent = msg;
        // Keep it styled as an info message unless it's a specific success/fail
        if(msg.includes('Failed') || msg.includes('Error')) {
             statusMessage.className = 'mb-6 p-4 bg-red-50 text-red-700 rounded-xl border border-red-100 font-medium text-sm transition-all duration-300';
        } else {
             statusMessage.className = 'mb-6 p-4 bg-blue-50 text-blue-700 rounded-xl border border-blue-100 font-medium text-sm transition-all duration-300';
        }
    });

    socket.on('qr', (url) => {
        qrContainer.classList.remove('hidden');
        chatsContainer.classList.add('hidden');
        qrImage.src = url;
        statusMessage.textContent = 'Scan the QR Code to login.';
        statusMessage.className = 'mb-6 p-4 bg-indigo-50 text-indigo-700 rounded-xl border border-indigo-100 font-medium text-sm transition-all duration-300';
    });

    socket.on('ready', (msg) => {
        qrContainer.classList.add('hidden');
        chatsContainer.classList.remove('hidden');
        statusMessage.textContent = msg;
        statusMessage.className = 'mb-6 p-4 bg-green-50 text-green-700 rounded-xl border border-green-100 font-medium text-sm transition-all duration-300';
    });

    socket.on('chats', (chats) => {
        chatCount.textContent = chats.length;
        chatsList.innerHTML = '';
        
        if(chats.length === 0) {
            chatsList.innerHTML = '<li class="p-4 text-center text-slate-500 text-sm">No chats found.</li>';
            return;
        }

        chats.forEach(chat => {
            const li = document.createElement('li');
            li.className = 'p-3 hover:bg-slate-100 cursor-pointer transition-colors flex justify-between items-center';
            li.innerHTML = `
                <span class="font-medium text-slate-700 truncate pr-2">${chat.name || 'Unknown'}</span>
                ${chat.unread ? `<span class="bg-green-500 text-white text-xs font-bold px-2 py-1 rounded-full shrink-0 shadow-sm">${chat.unread}</span>` : ''}
            `;
            chatsList.appendChild(li);
        });
    });
  </script>
</body>
</html>
