<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web Integration</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .message-row {
      display: flex;
      margin: 6px 0;
    }

    .message-row.me {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 82%;
      padding: 8px 11px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-row.me .message-bubble {
      background: #dcfce7;
      border-color: #bbf7d0;
    }

    .message-meta {
      margin-top: 3px;
      font-size: 10px;
      color: #64748b;
      text-align: right;
    }
  </style>
</head>

<body class="min-h-screen p-4 md:p-6">
  <div class="mx-auto max-w-6xl">

    <div class="mb-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <div class="text-xl font-bold text-slate-800">WhatsApp Test</div>
          <div id="connected-as" class="mt-1 text-sm font-semibold text-slate-500">
            CONNECTED AS —
          </div>
        </div>

        <button
          id="refresh-chats"
          class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-50"
          type="button"
        >
          Refresh Chats
        </button>
      </div>

      <div
        id="status-message"
        class="mt-4 rounded-xl border border-blue-100 bg-blue-50 p-3 text-sm font-medium text-blue-700"
      >
        Connecting to Server...
      </div>
    </div>

    <div id="qr-container" class="hidden rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="mb-4 text-center text-sm text-slate-500">
        Open WhatsApp on your phone → Settings → Linked Devices → Link a Device
      </p>

      <div class="flex justify-center">
        <div class="rounded-xl border border-slate-100 bg-white p-3 shadow-sm">
          <img
            id="qr-image"
            src=""
            alt="Scan this QR Code"
            class="h-56 w-56 object-contain"
          >
        </div>
      </div>
    </div>

    <div id="app-container" class="hidden grid gap-4 lg:grid-cols-[360px_1fr]">

      <!-- Recent chats -->
      <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-lg font-semibold text-slate-700">Recent Chats</h2>
          <span class="rounded-md bg-slate-100 px-2 py-1 text-xs font-bold text-slate-500">
            <span id="chat-count">0</span> Total
          </span>
        </div>

        <ul
          id="chats-list"
          class="h-[70vh] min-h-[420px] divide-y divide-slate-100 overflow-y-auto rounded-xl border border-slate-100 bg-slate-50"
        ></ul>
      </section>

      <!-- Messages -->
      <section class="flex min-h-[70vh] flex-col rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="border-b border-slate-200 p-4">
          <div id="selected-chat-name" class="font-semibold text-slate-800">
            Select a chat
          </div>
          <div id="selected-chat-id" class="mt-1 truncate text-xs text-slate-400"></div>
        </div>

        <div
          id="messages-list"
          class="flex-1 overflow-y-auto bg-slate-50 p-4"
        >
          <div class="flex h-full items-center justify-center text-sm text-slate-400">
            Click a recent chat to load its messages.
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const savedSessionToken = localStorage.getItem('wa_session_token') || null;

    const socket = io({
      auth: {
        sessionToken: savedSessionToken
      }
    });

    const statusMessage = document.getElementById('status-message');
    const qrContainer = document.getElementById('qr-container');
    const qrImage = document.getElementById('qr-image');
    const appContainer = document.getElementById('app-container');
    const chatsList = document.getElementById('chats-list');
    const chatCount = document.getElementById('chat-count');
    const refreshChatsButton = document.getElementById('refresh-chats');
    const connectedAs = document.getElementById('connected-as');

    const selectedChatName = document.getElementById('selected-chat-name');
    const selectedChatId = document.getElementById('selected-chat-id');
    const messagesList = document.getElementById('messages-list');

    let chatsById = new Map();
    let selectedChat = null;

    function setStatus(text, type = 'info') {
      statusMessage.textContent = text;

      const styles = {
        info: 'mt-4 rounded-xl border border-blue-100 bg-blue-50 p-3 text-sm font-medium text-blue-700',
        success: 'mt-4 rounded-xl border border-green-200 bg-green-50 p-3 text-sm font-medium text-green-700',
        warning: 'mt-4 rounded-xl border border-yellow-200 bg-yellow-50 p-3 text-sm font-medium text-yellow-800',
        error: 'mt-4 rounded-xl border border-red-200 bg-red-50 p-3 text-sm font-medium text-red-700'
      };

      statusMessage.className = styles[type] || styles.info;
    }

    function escapeText(value) {
      return value === null || value === undefined
        ? ''
        : String(value);
    }

    function formatTime(timestamp) {
      if (!timestamp) return '';

      const date = new Date(Number(timestamp) * 1000);
      if (Number.isNaN(date.getTime())) return '';

      return date.toLocaleString([], {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function renderChats(chats) {
      const safeChats = Array.isArray(chats) ? chats : [];

      chatsById = new Map(
        safeChats
          .filter(chat => chat && chat.id)
          .map(chat => [String(chat.id), chat])
      );

      chatCount.textContent = String(safeChats.length);
      chatsList.innerHTML = '';

      if (!safeChats.length) {
        const empty = document.createElement('li');
        empty.className = 'p-5 text-center text-sm text-slate-500';
        empty.textContent = 'No chats found.';
        chatsList.appendChild(empty);
        return;
      }

      safeChats.forEach(chat => {
        const li = document.createElement('li');
        li.dataset.chatId = String(chat.id);
        li.className =
          'cursor-pointer p-3 transition-colors hover:bg-slate-100';

        const top = document.createElement('div');
        top.className = 'flex items-center justify-between gap-2';

        const name = document.createElement('div');
        name.className = 'min-w-0 truncate font-semibold text-slate-700';
        name.textContent = escapeText(chat.name || 'Unknown');

        top.appendChild(name);

        const unread = Number(chat.unread || 0);
        if (unread > 0) {
          const badge = document.createElement('span');
          badge.className =
            'shrink-0 rounded-full bg-green-500 px-2 py-1 text-[10px] font-bold text-white';
          badge.textContent = String(unread);
          top.appendChild(badge);
        }

        const bottom = document.createElement('div');
        bottom.className = 'mt-1 flex items-center justify-between gap-2';

        const preview = document.createElement('div');
        preview.className = 'min-w-0 truncate text-xs text-slate-400';
        preview.textContent =
          escapeText(chat.lastMessageText || '') || 'Click to load messages';

        const time = document.createElement('div');
        time.className = 'shrink-0 text-[10px] text-slate-400';
        time.textContent = formatTime(chat.timestamp);

        bottom.appendChild(preview);
        bottom.appendChild(time);

        li.appendChild(top);
        li.appendChild(bottom);

        if (selectedChat && selectedChat.id === chat.id) {
          li.classList.add('bg-slate-100');
        }

        li.addEventListener('click', () => {
          loadMessages(chat);
        });

        chatsList.appendChild(li);
      });
    }

    function renderMessages(payload) {
      if (!payload || !Array.isArray(payload.messages)) return;

      const messages = payload.messages;
      messagesList.innerHTML = '';

      if (!messages.length) {
        const empty = document.createElement('div');
        empty.className =
          'flex h-full min-h-32 items-center justify-center text-sm text-slate-400';
        empty.textContent = 'No stored messages for this chat.';
        messagesList.appendChild(empty);
        return;
      }

      messages.forEach(message => {
        const row = document.createElement('div');
        row.className = `message-row ${message.fromMe ? 'me' : ''}`;

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';

        if (!message.fromMe && message.senderName) {
          const sender = document.createElement('div');
          sender.className = 'mb-1 text-xs font-semibold text-slate-500';
          sender.textContent = escapeText(message.senderName);
          bubble.appendChild(sender);
        }

        const body = document.createElement('div');
        body.textContent =
          escapeText(message.body) ||
          `[${escapeText(message.type || 'message')}]`;

        bubble.appendChild(body);

        const meta = document.createElement('div');
        meta.className = 'message-meta';
        meta.textContent = formatTime(message.timestamp);
        bubble.appendChild(meta);

        row.appendChild(bubble);
        messagesList.appendChild(row);
      });

      messagesList.scrollTop = messagesList.scrollHeight;
    }

    function loadMessages(chat) {
      selectedChat = chat;

      selectedChatName.textContent = escapeText(chat.name || 'Unknown');
      selectedChatId.textContent = escapeText(chat.id);

      renderChats(Array.from(chatsById.values()));

      messagesList.innerHTML = '';
      const loading = document.createElement('div');
      loading.className =
        'flex h-full min-h-32 items-center justify-center text-sm text-slate-400';
      loading.textContent = 'Loading messages...';
      messagesList.appendChild(loading);

      socket.emit('getMessages', String(chat.id));
    }

    socket.on('connect', () => {
      setStatus('Connected to Server. Waiting for WhatsApp...', 'warning');
    });

    socket.on('disconnect', () => {
      setStatus('Disconnected from Server.', 'error');
    });

    socket.on('session', session => {
      if (session?.token) {
        localStorage.setItem('wa_session_token', session.token);
      }

      if (session?.accountNumber) {
        connectedAs.textContent = `CONNECTED AS ${session.accountNumber}`;
      }
    });

    socket.on('message', msg => {
      const text = String(msg || '');
      const lower = text.toLowerCase();

      if (
        lower.includes('failed') ||
        lower.includes('error') ||
        lower.includes('could not')
      ) {
        setStatus(text, 'error');
      } else if (
        lower.includes('successfully') ||
        lower.includes('connected')
      ) {
        setStatus(text, 'success');
      } else if (lower.includes('waiting') || lower.includes('scan')) {
        setStatus(text, 'warning');
      } else {
        setStatus(text, 'info');
      }
    });

    socket.on('qr', url => {
      qrContainer.classList.remove('hidden');
      appContainer.classList.add('hidden');
      qrImage.src = url;

      connectedAs.textContent = 'CONNECTED AS —';
      setStatus('Scan the QR Code to login.', 'warning');
    });

    socket.on('ready', data => {
      qrContainer.classList.add('hidden');
      appContainer.classList.remove('hidden');

      const accountNumber =
        data?.accountNumber ||
        'Unknown';

      connectedAs.textContent = `CONNECTED AS ${accountNumber}`;
      setStatus(
        data?.text || `CONNECTED AS ${accountNumber}`,
        'success'
      );

      socket.emit('getChats');
    });

    socket.on('chats', chats => {
      qrContainer.classList.add('hidden');
      appContainer.classList.remove('hidden');
      renderChats(chats || []);
    });

    socket.on('messages', payload => {
      if (
        selectedChat &&
        payload &&
        String(payload.chatId) === String(selectedChat.id)
      ) {
        renderMessages(payload);
      }
    });

    socket.on('messagesError', message => {
      messagesList.innerHTML = '';

      const error = document.createElement('div');
      error.className =
        'flex h-full min-h-32 items-center justify-center text-sm text-red-500';
      error.textContent = String(message || 'Failed to load messages.');
      messagesList.appendChild(error);
    });

    socket.on('newMessage', message => {
      if (
        selectedChat &&
        message &&
        String(message.chatId) === String(selectedChat.id)
      ) {
        socket.emit('getMessages', String(selectedChat.id));
      }
    });

    socket.on('whatsappDisconnected', reason => {
      setStatus(
        `WhatsApp disconnected: ${reason || 'Unknown reason'}`,
        'error'
      );
    });

    refreshChatsButton.addEventListener('click', () => {
      refreshChatsButton.disabled = true;
      socket.emit('getChats');

      setTimeout(() => {
        refreshChatsButton.disabled = false;
      }, 1200);
    });
  </script>
</body>
</html>
