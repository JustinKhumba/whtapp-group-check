<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Checker Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #25D366;
            --border: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #111827;
                --card-bg: #1f2937;
                --text-main: #f9fafb;
                --text-muted: #9ca3af;
                --border: #374151;
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 { margin: 0 0 8px 0; font-size: 1.5rem; }
        p { color: var(--text-muted); margin-bottom: 24px; font-size: 0.9rem; }

        .qr-box {
            background: white;
            padding: 16px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 16px;
            border: 1px solid #e5e7eb;
        }
        
        .qr-box img { width: 250px; height: 250px; display: block; }
        
        .loader {
            display: inline-block;
            width: 40px; height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 40px 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .group-list {
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 16px;
        }

        .group-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .group-item:last-child { border-bottom: none; }
        .group-name { font-weight: 600; font-size: 0.95rem; }
        .group-id { font-family: monospace; font-size: 0.8rem; color: var(--text-muted); background: var(--bg-color); padding: 4px; border-radius: 4px;}

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Server Setup</h1>
        <p id="statusText">Connecting to Node.js server...</p>

        <!-- Loading State -->
        <div id="loadingState">
            <div class="loader"></div>
        </div>

        <!-- QR Code State -->
        <div id="qrState" class="hidden">
            <div class="qr-box">
                <img id="qrImage" src="" alt="WhatsApp QR Code">
            </div>
            <p style="margin:0;">Open WhatsApp > Linked Devices > Link a Device</p>
        </div>

        <!-- Authenticated State -->
        <div id="authState" class="hidden">
            <div style="color: var(--primary); font-size: 3rem; margin-bottom: 16px;">✅</div>
            <h2>WhatsApp Linked!</h2>
            <p>Copy the ID of the group you want to monitor into your Railway variables as <strong>WHATSAPP_GROUP_ID</strong>.</p>
            
            <div class="group-list" id="groupContainer">
                <!-- Groups injected here -->
            </div>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('statusText');
        const loadingState = document.getElementById('loadingState');
        const qrState = document.getElementById('qrState');
        const authState = document.getElementById('authState');
        const qrImage = document.getElementById('qrImage');
        const groupContainer = document.getElementById('groupContainer');

        async function pollData() {
            try {
                const res = await fetch('/api/setup-data');
                const data = await res.json();

                if (data.ready && data.groups.length > 0) {
                    // WhatsApp is fully ready and groups are loaded
                    statusText.innerText = "Setup Complete";
                    loadingState.classList.add('hidden');
                    qrState.classList.add('hidden');
                    authState.classList.remove('hidden');
                    
                    renderGroups(data.groups);
                    return; // Stop polling once ready
                } 
                else if (data.authenticated) {
                    // Logged in, waiting for groups to load
                    statusText.innerText = "Authenticated! Loading groups...";
                    loadingState.classList.remove('hidden');
                    qrState.classList.add('hidden');
                } 
                else if (data.qr) {
                    // Waiting for QR scan
                    statusText.innerText = "Scan this QR code to login";
                    loadingState.classList.add('hidden');
                    qrState.classList.remove('hidden');
                    qrImage.src = data.qr;
                }

                // Poll again in 2 seconds
                setTimeout(pollData, 2000);
            } catch (err) {
                statusText.innerText = "Lost connection to server. Retrying...";
                setTimeout(pollData, 5000);
            }
        }

        function renderGroups(groups) {
            groupContainer.innerHTML = '';
            groups.forEach(group => {
                const div = document.createElement('div');
                div.className = 'group-item';
                div.innerHTML = `
                    <span class="group-name">${group.name}</span>
                    <span class="group-id">${group.id}</span>
                `;
                groupContainer.appendChild(div);
            });
        }

        // Start polling on load
        pollData();
    </script>
</body>
</html>
