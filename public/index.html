<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WhatsApp Web</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="/socket.io/socket.io.js"></script>

    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .message-in {
            background: white;
        }

        .message-out {
            background: #dcf8c6;
        }
    </style>
</head>

<body
    class="min-h-screen bg-slate-100 text-slate-800"
>

    <div
        class="mx-auto flex min-h-screen w-full max-w-6xl flex-col"
    >

        <!-- HEADER -->

        <header
            class="border-b border-slate-200 bg-white px-4 py-4 shadow-sm"
        >

            <div
                class="flex items-center justify-between gap-4"
            >

                <div>

                    <h1
                        class="text-xl font-bold"
                    >
                        WhatsApp Web
                    </h1>

                    <div
                        id="connected-account"
                        class="mt-1 text-sm font-semibold text-slate-500"
                    >
                        CONNECTED AS —
                    </div>

                </div>

                <button
                    id="refresh-chats"
                    type="button"
                    class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700"
                >
                    Refresh
                </button>

            </div>

        </header>


        <!-- STATUS -->

        <div
            id="status-message"
            class="mx-4 mt-4 rounded-xl border border-blue-100 bg-blue-50 p-4 text-sm font-medium text-blue-700"
        >
            Connecting to Server...
        </div>


        <!-- QR -->

        <section
            id="qr-container"
            class="mx-4 mt-4 hidden rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
        >

            <p
                class="mb-4 text-center text-sm text-slate-500"
            >
                Open WhatsApp on your phone →
                Settings →
                Linked Devices →
                Link a Device
            </p>

            <div
                class="flex justify-center"
            >
                <img
                    id="qr-image"
                    src=""
                    alt="WhatsApp QR Code"
                    class="h-64 w-64 rounded-xl border border-slate-200"
                >
            </div>

        </section>


        <!-- MAIN -->

        <main
            class="grid flex-1 grid-cols-1 gap-4 p-4 lg:grid-cols-3"
        >

            <!-- RECENT CHATS -->

            <section
                id="chats-container"
                class="hidden rounded-2xl border border-slate-200 bg-white shadow-sm lg:col-span-1"
            >

                <div
                    class="flex items-center justify-between border-b border-slate-100 px-4 py-4"
                >

                    <div>

                        <h2
                            class="font-semibold"
                        >
                            Recent Chats
                        </h2>

                        <p
                            class="text-xs text-slate-400"
                        >
                            <span id="chat-count">
                                0
                            </span>
                            chats
                        </p>

                    </div>

                </div>


                <ul
                    id="chats-list"
                    class="max-h-[70vh] overflow-y-auto"
                >
                </ul>

            </section>


            <!-- MESSAGES -->

            <section
                id="messages-container"
                class="hidden flex min-h-[500px] flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm lg:col-span-2"
            >

                <div
                    class="border-b border-slate-100 px-4 py-4"
                >

                    <h2
                        id="selected-chat-name"
                        class="font-semibold"
                    >
                        Select a chat
                    </h2>

                    <p
                        id="selected-chat-id"
                        class="mt-1 text-xs text-slate-400"
                    >
                    </p>

                </div>


                <div
                    id="messages-list"
                    class="flex-1 space-y-2 overflow-y-auto bg-slate-50 p-4"
                >

                    <div
                        class="py-10 text-center text-sm text-slate-400"
                    >
                        Select a chat to view messages.
                    </div>

                </div>

            </section>


            <!-- AUTO REPLY -->

            <section
                id="auto-reply-panel"
                class="hidden rounded-2xl border border-slate-200 bg-white p-4 shadow-sm lg:col-span-1"
            >

                <div
                    class="flex items-start justify-between gap-4"
                >

                    <div>

                        <h2
                            class="font-semibold text-slate-700"
                        >
                            Auto Reply
                        </h2>

                        <p
                            class="mt-1 text-xs text-slate-400"
                        >
                            Individual users only
                        </p>

                    </div>


                    <label
                        class="flex cursor-pointer items-center gap-2 text-sm font-semibold"
                    >

                        <input
                            id="auto-reply-enabled"
                            type="checkbox"
                            class="h-4 w-4"
                        >

                        Enabled

                    </label>

                </div>


                <div
                    class="mt-5"
                >

                    <label
                        for="auto-reply-trigger"
                        class="mb-1 block text-xs font-semibold text-slate-500"
                    >
                        Trigger
                    </label>

                    <input
                        id="auto-reply-trigger"
                        type="text"
                        value="START"
                        maxlength="255"
                        class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none focus:border-slate-400"
                        placeholder="START"
                    >

                </div>


                <div
                    class="mt-4"
                >

                    <label
                        for="auto-reply-text"
                        class="mb-1 block text-xs font-semibold text-slate-500"
                    >
                        Response
                    </label>

                    <textarea
                        id="auto-reply-text"
                        rows="5"
                        class="w-full resize-y rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none focus:border-slate-400"
                        placeholder="Hello! Thanks for messaging."
                    ></textarea>

                </div>


                <div
                    class="mt-4 flex items-center gap-3"
                >

                    <button
                        id="save-auto-reply"
                        type="button"
                        class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700"
                    >
                        Save Auto Reply
                    </button>

                    <span
                        id="auto-reply-status"
                        class="text-xs text-slate-400"
                    ></span>

                </div>

            </section>

        </main>

    </div>


    <script>
        // =================================================
        // PERSISTENT BROWSER SESSION
        // =================================================

        const savedSessionToken =
            localStorage.getItem(
                'whatsapp_session_token'
            );

        const socket =
            io({
                auth: {
                    sessionToken:
                        savedSessionToken || null
                }
            });


        // =================================================
        // ELEMENTS
        // =================================================

        const statusMessage =
            document.getElementById(
                'status-message'
            );

        const qrContainer =
            document.getElementById(
                'qr-container'
            );

        const qrImage =
            document.getElementById(
                'qr-image'
            );

        const connectedAccount =
            document.getElementById(
                'connected-account'
            );

        const chatsContainer =
            document.getElementById(
                'chats-container'
            );

        const chatsList =
            document.getElementById(
                'chats-list'
            );

        const chatCount =
            document.getElementById(
                'chat-count'
            );

        const messagesContainer =
            document.getElementById(
                'messages-container'
            );

        const messagesList =
            document.getElementById(
                'messages-list'
            );

        const selectedChatName =
            document.getElementById(
                'selected-chat-name'
            );

        const selectedChatId =
            document.getElementById(
                'selected-chat-id'
            );

        const refreshChatsButton =
            document.getElementById(
                'refresh-chats'
            );


        // =================================================
        // AUTO REPLY ELEMENTS
        // =================================================

        const autoReplyPanel =
            document.getElementById(
                'auto-reply-panel'
            );

        const autoReplyEnabled =
            document.getElementById(
                'auto-reply-enabled'
            );

        const autoReplyTrigger =
            document.getElementById(
                'auto-reply-trigger'
            );

        const autoReplyText =
            document.getElementById(
                'auto-reply-text'
            );

        const saveAutoReplyButton =
            document.getElementById(
                'save-auto-reply'
            );

        const autoReplyStatus =
            document.getElementById(
                'auto-reply-status'
            );


        let currentChats = [];

        let currentChatId = null;


        // =================================================
        // STATUS HELPERS
        // =================================================

        function setStatus(
            text,
            type = 'info'
        ) {
            statusMessage.textContent =
                text;

            if (
                type === 'success'
            ) {
                statusMessage.className =
                    'mx-4 mt-4 rounded-xl border border-green-100 bg-green-50 p-4 text-sm font-medium text-green-700';
            } else if (
                type === 'error'
            ) {
                statusMessage.className =
                    'mx-4 mt-4 rounded-xl border border-red-100 bg-red-50 p-4 text-sm font-medium text-red-700';
            } else if (
                type === 'warning'
            ) {
                statusMessage.className =
                    'mx-4 mt-4 rounded-xl border border-yellow-100 bg-yellow-50 p-4 text-sm font-medium text-yellow-700';
            } else {
                statusMessage.className =
                    'mx-4 mt-4 rounded-xl border border-blue-100 bg-blue-50 p-4 text-sm font-medium text-blue-700';
            }
        }


        // =================================================
        // CONNECTION
        // =================================================

        socket.on(
            'connect',
            () => {
                setStatus(
                    'Connected to server. Waiting for WhatsApp...'
                );
            }
        );


        socket.on(
            'disconnect',
            () => {
                setStatus(
                    'Disconnected from server.',
                    'error'
                );
            }
        );


        // =================================================
        // SESSION
        // =================================================

        socket.on(
            'session',
            data => {
                if (
                    data &&
                    data.token
                ) {
                    localStorage.setItem(
                        'whatsapp_session_token',
                        data.token
                    );
                }

                if (
                    data &&
                    data.accountNumber
                ) {
                    connectedAccount.textContent =
                        `CONNECTED AS ${data.accountNumber}`;
                }
            }
        );


        // =================================================
        // GENERAL SERVER MESSAGE
        // =================================================

        socket.on(
            'message',
            message => {

                const text =
                    String(
                        message || ''
                    );

                if (
                    text
                        .toLowerCase()
                        .includes(
                            'failed'
                        ) ||
                    text
                        .toLowerCase()
                        .includes(
                            'error'
                        )
                ) {
                    setStatus(
                        text,
                        'error'
                    );
                } else {
                    setStatus(
                        text
                    );
                }
            }
        );


        // =================================================
        // QR
        // =================================================

        socket.on(
            'qr',
            url => {
                qrContainer.classList.remove(
                    'hidden'
                );

                chatsContainer.classList.add(
                    'hidden'
                );

                messagesContainer.classList.add(
                    'hidden'
                );

                qrImage.src =
                    url;

                setStatus(
                    'Scan the QR code to login.',
                    'warning'
                );
            }
        );


        // =================================================
        // READY
        // =================================================

        socket.on(
            'ready',
            data => {

                qrContainer.classList.add(
                    'hidden'
                );

                chatsContainer.classList.remove(
                    'hidden'
                );

                messagesContainer.classList.remove(
                    'hidden'
                );

                autoReplyPanel.classList.remove(
                    'hidden'
                );

                if (
                    data &&
                    data.accountNumber
                ) {
                    connectedAccount.textContent =
                        `CONNECTED AS ${data.accountNumber}`;
                }

                setStatus(
                    'WhatsApp is connected.',
                    'success'
                );

                socket.emit(
                    'getAutoReply'
                );

                socket.emit(
                    'getChats'
                );
            }
        );


        // =================================================
        // RECENT CHATS
        // =================================================

        socket.on(
            'chats',
            chats => {

                currentChats =
                    Array.isArray(chats)
                        ? chats
                        : [];

                chatCount.textContent =
                    currentChats.length;

                renderChats(
                    currentChats
                );

                chatsContainer.classList.remove(
                    'hidden'
                );
            }
        );


        function renderChats(
            chats
        ) {
            chatsList.innerHTML = '';

            if (
                !chats.length
            ) {
                const empty =
                    document.createElement(
                        'li'
                    );

                empty.className =
                    'p-6 text-center text-sm text-slate-400';

                empty.textContent =
                    'No chats found.';

                chatsList.appendChild(
                    empty
                );

                return;
            }

            chats.forEach(
                chat => {

                    const li =
                        document.createElement(
                            'li'
                        );

                    li.className =
                        'cursor-pointer border-b border-slate-100 p-4 transition hover:bg-slate-50';

                    if (
                        chat.id ===
                        currentChatId
                    ) {
                        li.classList.add(
                            'bg-slate-100'
                        );
                    }


                    const row =
                        document.createElement(
                            'div'
                        );

                    row.className =
                        'flex items-center justify-between gap-3';


                    const left =
                        document.createElement(
                            'div'
                        );

                    left.className =
                        'min-w-0 flex-1';


                    const name =
                        document.createElement(
                            'div'
                        );

                    name.className =
                        'truncate font-semibold text-slate-700';

                    name.textContent =
                        chat.name ||
                        'Unknown';


                    const id =
                        document.createElement(
                            'div'
                        );

                    id.className =
                        'mt-1 truncate text-xs text-slate-400';

                    id.textContent =
                        chat.id;


                    left.appendChild(
                        name
                    );

                    left.appendChild(
                        id
                    );


                    row.appendChild(
                        left
                    );


                    if (
                        Number(
                            chat.unread || 0
                        ) > 0
                    ) {

                        const unread =
                            document.createElement(
                                'span'
                            );

                        unread.className =
                            'flex h-6 min-w-6 items-center justify-center rounded-full bg-green-500 px-2 text-xs font-bold text-white';

                        unread.textContent =
                            String(
                                chat.unread
                            );

                        row.appendChild(
                            unread
                        );
                    }


                    li.appendChild(
                        row
                    );


                    li.addEventListener(
                        'click',
                        () => {
                            openChat(
                                chat
                            );
                        }
                    );


                    chatsList.appendChild(
                        li
                    );
                }
            );
        }


        // =================================================
        // OPEN CHAT
        // =================================================

        function openChat(
            chat
        ) {
            if (
                !chat ||
                !chat.id
            ) {
                return;
            }

            currentChatId =
                chat.id;

            selectedChatName.textContent =
                chat.name ||
                'Unknown';

            selectedChatId.textContent =
                chat.id;

            messagesList.innerHTML = '';

            const loading =
                document.createElement(
                    'div'
                );

            loading.className =
                'py-10 text-center text-sm text-slate-400';

            loading.textContent =
                'Loading messages...';

            messagesList.appendChild(
                loading
            );

            renderChats(
                currentChats
            );

            socket.emit(
                'getMessages',
                chat.id
            );
        }


        // =================================================
        // MESSAGES
        // =================================================

        socket.on(
            'messages',
            data => {

                if (
                    !data ||
                    !data.chatId
                ) {
                    return;
                }

                if (
                    data.chatId !==
                    currentChatId
                ) {
                    return;
                }

                renderMessages(
                    data.messages || []
                );
            }
        );


        socket.on(
            'messagesError',
            error => {

                if (
                    currentChatId
                ) {
                    messagesList.innerHTML = '';

                    const box =
                        document.createElement(
                            'div'
                        );

                    box.className =
                        'p-4 text-center text-sm text-red-500';

                    box.textContent =
                        String(
                            error ||
                            'Failed to load messages.'
                        );

                    messagesList.appendChild(
                        box
                    );
                }
            }
        );


        function renderMessages(
            messages
        ) {
            messagesList.innerHTML = '';

            if (
                !messages.length
            ) {
                const empty =
                    document.createElement(
                        'div'
                    );

                empty.className =
                    'py-10 text-center text-sm text-slate-400';

                empty.textContent =
                    'No messages found.';

                messagesList.appendChild(
                    empty
                );

                return;
            }

            messages.forEach(
                message => {

                    const wrapper =
                        document.createElement(
                            'div'
                        );

                    wrapper.className =
                        message.fromMe
                            ? 'flex justify-end'
                            : 'flex justify-start';


                    const bubble =
                        document.createElement(
                            'div'
                        );

                    bubble.className =
                        message.fromMe
                            ? 'message-out max-w-[80%] rounded-xl px-3 py-2 shadow-sm'
                            : 'message-in max-w-[80%] rounded-xl px-3 py-2 shadow-sm';


                    const body =
                        document.createElement(
                            'div'
                        );

                    body.className =
                        'whitespace-pre-wrap break-words text-sm';

                    body.textContent =
                        message.body ||
                        `[${message.type || 'message'}]`;


                    const time =
                        document.createElement(
                            'div'
                        );

                    time.className =
                        'mt-1 text-right text-[10px] text-slate-400';

                    time.textContent =
                        formatTimestamp(
                            message.timestamp
                        );


                    bubble.appendChild(
                        body
                    );

                    bubble.appendChild(
                        time
                    );

                    wrapper.appendChild(
                        bubble
                    );

                    messagesList.appendChild(
                        wrapper
                    );
                }
            );

            messagesList.scrollTop =
                messagesList.scrollHeight;
        }


        function formatTimestamp(
            timestamp
        ) {
            const number =
                Number(
                    timestamp || 0
                );

            if (
                !number
            ) {
                return '';
            }

            const date =
                new Date(
                    number * 1000
                );

            return date.toLocaleString();
        }


        // =================================================
        // NEW MESSAGE
        // =================================================

        socket.on(
            'newMessage',
            message => {

                if (
                    !message ||
                    message.chatId !==
                        currentChatId
                ) {
                    return;
                }

                socket.emit(
                    'getMessages',
                    currentChatId
                );
            }
        );


        // =================================================
        // REFRESH CHATS
        // =================================================

        refreshChatsButton.addEventListener(
            'click',
            () => {

                setStatus(
                    'Refreshing chats...'
                );

                socket.emit(
                    'getChats'
                );
            }
        );


        // =================================================
        // AUTO REPLY SETTINGS
        // =================================================

        socket.on(
            'autoReply',
            settings => {

                autoReplyPanel.classList.remove(
                    'hidden'
                );

                autoReplyEnabled.checked =
                    Boolean(
                        settings?.enabled
                    );

                autoReplyTrigger.value =
                    settings?.triggerText ||
                    'START';

                autoReplyText.value =
                    settings?.replyText ||
                    '';

                updateAutoReplyStatus(
                    settings
                );

                saveAutoReplyButton.disabled =
                    false;
            }
        );


        function updateAutoReplyStatus(
            settings
        ) {
            if (
                settings &&
                settings.enabled
            ) {
                autoReplyStatus.textContent =
                    `Active: ${settings.triggerText}`;

                autoReplyStatus.className =
                    'text-xs text-green-600';
            } else {
                autoReplyStatus.textContent =
                    'Disabled';

                autoReplyStatus.className =
                    'text-xs text-slate-400';
            }
        }


        socket.on(
            'autoReplyError',
            message => {

                autoReplyStatus.textContent =
                    String(
                        message ||
                        'Auto reply error.'
                    );

                autoReplyStatus.className =
                    'text-xs text-red-500';

                saveAutoReplyButton.disabled =
                    false;
            }
        );


        saveAutoReplyButton.addEventListener(
            'click',
            () => {

                const triggerText =
                    autoReplyTrigger.value.trim();

                const replyText =
                    autoReplyText.value.trim();

                const enabled =
                    autoReplyEnabled.checked;


                if (
                    !triggerText
                ) {
                    autoReplyStatus.textContent =
                        'Enter a trigger.';

                    autoReplyStatus.className =
                        'text-xs text-red-500';

                    return;
                }


                if (
                    enabled &&
                    !replyText
                ) {
                    autoReplyStatus.textContent =
                        'Enter a response.';

                    autoReplyStatus.className =
                        'text-xs text-red-500';

                    return;
                }


                saveAutoReplyButton.disabled =
                    true;

                autoReplyStatus.textContent =
                    'Saving...';

                autoReplyStatus.className =
                    'text-xs text-slate-400';


                socket.emit(
                    'saveAutoReply',
                    {
                        enabled,

                        triggerText,

                        replyText
                    }
                );
            }
        );


        // =================================================
        // WHATSAPP DISCONNECTED
        // =================================================

        socket.on(
            'whatsappDisconnected',
            reason => {

                setStatus(
                    `WhatsApp disconnected: ${reason}`,
                    'error'
                );
            }
        );
    </script>

</body>

</html>
